t fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="291.2006" x="144.8243" y="426.6726">&#160;na se&#231;&#227;o do relat&#243;rio correspondente&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="72.4482" x="467.2729" y="404.8806">&#160;10 casos&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.0721" x="21.16" y="448.4646">&#160;Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="76.8001" x="17" y="470.2567">&#160;(consulta&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="123.6643" x="17" y="492.0487">&#160;complementar)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="265.1526" x="148.9843" y="448.4646">&#160;Contagem de cadastros e v&#237;nculos&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="148.9603" x="144.8243" y="470.2567">&#160;hist&#243;ricos por ciclo&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="108.8322" x="467.2729" y="448.4646">&#160;30 empresas,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="138.6083" x="463.1129" y="470.2567">&#160;30 checklists e 30&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="151.2323" x="463.1129" y="492.0487">&#160;vers&#245;es publicadas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.0721" x="21.16" y="513.8408">&#160;Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="292.1926" x="148.9843" y="513.8408">&#160;Inspe&#231;&#245;es conclu&#237;das e sincronizadas,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="175.6004" x="144.8243" y="535.6328">&#160;snapshots e respostas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="109.6642" x="467.2729" y="513.8408">&#160;30 inspe&#231;&#245;es,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="121.0082" x="463.1129" y="535.6328">&#160;30 snapshots e&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="103.6802" x="463.1129" y="557.4249">&#160;60 respostas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.0721" x="21.16" y="579.2169">&#160;Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="307.7446" x="148.9843" y="579.2169">&#160;Contagem de n&#227;o conformidades ativas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="118.4003" x="467.2729" y="579.2169">&#160;10 ocorr&#234;ncias&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="104.4799" y2="104.4799"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="126.272" y2="126.272"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="169.8561" y2="169.8561"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="213.4402" y2="213.4402"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="235.2322" y2="235.2322"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="278.8163" y2="278.8163"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="344.1924" y2="344.1924"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="387.7765" y2="387.7765"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="618.5052" y1="431.3606" y2="431.3606"/><lin