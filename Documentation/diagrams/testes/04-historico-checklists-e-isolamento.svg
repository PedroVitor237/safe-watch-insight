<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="857px" preserveAspectRatio="none" style="width:721px;height:857px;background:#FFFFFF;" version="1.1" viewBox="0 0 721 857" width="721px" zoomAndPan="magnify"><title>Safe Watch Insight</title><defs/><g><g class="title" data-source-line="19"><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="188.0198" x="262.5188" y="31.38">Safe Watch Insight</text><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="554.1196" x="79.4689" y="58.62">Hist&#243;rico, c&#243;pia de checklists e isolamento entre contas</text></g><g class="legend" data-source-line="21"><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="97.0722" x="21.16" y="121.584">&#160;Verifica&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="86.4482" x="189.8803" y="121.584">&#160;Ambiente&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="172.1763" x="350.1207" y="121.584">&#160;Resultado verificado&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="98.5442" x="21.16" y="143.376">&#160;Hist&#243;rico de&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="80.4962" x="17" y="165.1681">&#160;checklists&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="96.2562" x="189.8803" y="143.376">&#160;PostgreSQL&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="115.6802" x="185.7203" y="165.1681">&#160;no Neon (TCC)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="143.376">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="81.4562" x="354.2807" y="143.376">Aprovada.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="180.1604" x="439.8968" y="143.376">Conferiu a migra&#231;&#227;o de&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="292.3206" x="345.9606" y="165.1681">&#160;dados legados, os snapshots de v1/v2&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="316.4966" x="345.9606" y="186.9601">&#160;com itens e normas, a n&#227;o conformidade&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="331.1687" x="345.9606" y="208.7522">&#160;hist&#243;rica, a inspe&#231;&#227;o conclu&#237;da ap&#243;s edi&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="235.6004" x="345.9606" y="230.5442">&#160;e a revers&#227;o em caso de falha.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="86.6082" x="21.16" y="252.3362">&#160;Templates&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="107.7122" x="17" y="274.1283">&#160;institucionais&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="96.2562" x="189.8803" y="252.3362">&#160;PostgreSQL&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="115.6802" x="185.7203" y="274.1283">&#160;no Neon (TCC)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="252.3362">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="24.9121" x="354.2807" y="252.3362">8/8</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="271.4886" x="379.1927" y="252.3362">, incluindo o teste pai e 7 subtestes.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="316.5126" x="345.9606" y="274.1283">&#160;A deriva&#231;&#227;o, a autoriza&#231;&#227;o e a publica&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="294.4966" x="345.9606" y="295.9203">&#160;foram conferidas junto ao snapshot, &#224;&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="192.6404" x="345.9606" y="317.7124">&#160;conclus&#227;o e ao relat&#243;rio.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="160.4003" x="21.16" y="339.5044">&#160;C&#243;pia independente&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="96.2562" x="189.8803" y="339.5044">&#160;PostgreSQL&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="115.6802" x="185.7203" y="361.2965">&#160;no Neon (TCC)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="339.5044">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="43.2161" x="354.2807" y="339.5044">10/10</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="271.4886" x="397.4968" y="339.5044">, incluindo o teste pai e 9 subtestes.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="343.2647" x="345.9606" y="361.2965">&#160;C&#243;pias pessoais independentes, prote&#231;&#227;o de&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="323.8406" x="345.9606" y="383.0885">&#160;rascunhos alheios, reutiliza&#231;&#227;o de vers&#245;es&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="319.5206" x="345.9606" y="404.8806">&#160;publicadas acess&#237;veis e revers&#227;o de falha.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="124.9603" x="21.16" y="426.6726">&#160;Edi&#231;&#227;o da c&#243;pia&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="111.0562" x="17" y="448.4646">&#160;pela interface&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="92.8322" x="189.8803" y="426.6726">&#160;Chromium,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="142.1762" x="185.7203" y="448.4646">&#160;banco Neon (TCC)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="426.6726">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="29.4721" x="354.2807" y="426.6726">1/1.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="277.0725" x="387.9127" y="426.6726">A edi&#231;&#227;o da c&#243;pia pessoal preservou&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="344.6407" x="345.9606" y="448.4646">&#160;o template de origem. Chamadas de terceiro&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="242.6405" x="345.9606" y="470.2567">&#160;e sem sess&#227;o foram recusadas.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="144.5443" x="21.16" y="492.0487">&#160;Acesso a registros&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="73.1842" x="17" y="513.8408">&#160;privados&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="96.2562" x="189.8803" y="492.0487">&#160;PostgreSQL&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="115.6802" x="185.7203" y="513.8408">&#160;no Neon (TCC)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="492.0487">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="219.2324" x="354.2807" y="492.0487">Aprovada com duas contas.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="64.6081" x="577.6731" y="492.0487">Leituras&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="262.2406" x="345.9606" y="513.8408">&#160;e altera&#231;&#245;es de registros privados&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="274.0965" x="345.9606" y="535.6328">&#160;alheios foram bloqueadas. O titular&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="282.1286" x="345.9606" y="557.4249">&#160;concluiu a inspe&#231;&#227;o e p&#244;de reutilizar&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="162.2243" x="345.9606" y="579.2169">&#160;conte&#250;do publicado.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="149.9043" x="21.16" y="601.0089">&#160;Cache React Query&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="131.5843" x="189.8803" y="601.0089">&#160;Chromium local,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="156.0803" x="185.7203" y="622.801">&#160;respostas sint&#233;ticas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="601.0089">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="29.4721" x="354.2807" y="601.0089">5/5.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="214.2404" x="387.9127" y="601.0089">Cache separado na troca ou&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="269.0885" x="345.9606" y="622.801">&#160;expira&#231;&#227;o da sess&#227;o, inclusive com&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="307.1847" x="345.9606" y="644.593">&#160;consultas pendentes e retornos tardios.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="77.6801" x="21.16" y="666.3851">&#160;Cache do&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="117.7762" x="17" y="688.1771">&#160;service worker&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="145.2163" x="189.8803" y="666.3851">&#160;Chromium e HTTP&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="110.5442" x="185.7203" y="688.1771">&#160;local, dados e&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="156.0803" x="185.7203" y="709.9692">&#160;respostas sint&#233;ticas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="350.1207" y="666.3851">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="29.4721" x="354.2807" y="666.3851">8/8.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="273.3766" x="387.9127" y="666.3851">O service worker deixou de guardar&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="307.9366" x="345.9606" y="688.1771">&#160;HTML e respostas privadas. Reabertura,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="345.9367" x="345.9606" y="709.9692">&#160;expira&#231;&#227;o e troca de conta foram verificadas.&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="104.4799" y2="104.4799"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="126.272" y2="126.272"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="235.2322" y2="235.2322"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="322.4004" y2="322.4004"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="409.5686" y2="409.5686"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="474.9447" y2="474.9447"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="583.9049" y2="583.9049"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="649.281" y2="649.281"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="696.0574" y1="714.6572" y2="714.6572"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="17" y1="104.4799" y2="714.6572"/><line style="stroke:#000000;stroke-width:1;" x1="185.7203" x2="185.7203" y1="104.4799" y2="714.6572"/><line style="stroke:#000000;stroke-width:1;" x1="345.9606" x2="345.9606" y1="104.4799" y2="714.6572"/><line style="stroke:#000000;stroke-width:1;" x1="696.0574" x2="696.0574" y1="104.4799" y2="714.6572"/></g><g class="footer" data-source-line="32"><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="479.8202" x="116.6186" y="749.6231">Os resultados s&#227;o apresentados por execu&#231;&#227;o, com cen&#225;rios em comum.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="397.9626" x="157.5474" y="768.691">Os registros de hist&#243;rico e autoriza&#231;&#227;o informam aprova&#231;&#227;o.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="459.5623" x="126.7476" y="787.7589">Templates e c&#243;pia refletem a valida&#231;&#227;o final ap&#243;s a corre&#231;&#227;o no Neon.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.64" x="354.7087" y="806.8269">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="432.1504" x="140.4535" y="825.8948">Fonte dos dados &#8212; AI/OfficialTemplates.md, AI/ChecklistCopy.md</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="386.2585" x="163.3995" y="844.9627">e auditoria t&#233;cnica pr&#233;-escrita do TCC (IC-P6-02 e IC-P9-02).</text></g><!--SRC=[dLQnSjj64Etn5LlQ78gKDB5Z5oaOJZBIZ6B9biPft1o19N4HS8VS0PJiSU6Fo0SeayAZmfMI9gNm9_cIlCKTG4ho94uQYSGjzjvx-tQN_boRIZbLqaAbvojd6vFDRM4TNUIwviGFvnalLLFKtrjJlr0bqynfLMoT5xnYaydngNx7jFTqwwpMTS73qVxkrj7IsfhTvhMlFdiM82qAODmwzxdAx8KsArggmlC3CD_-2wKOPLt6BaJKJXcFGpPradIewLGjcNvKTPhJeV5wbTTlp87sTNlZT6h7bBOtbLQGXzASq_C2HvwOjBS5P3Ar9VnnE0KDvPCaN9gy_uPkhrwpqqkTglPZ-vkzlQBkuQnSQBp2_VTNxA4xcD8wXcTTRF8UXniaG71xzSRSNcrWI1HYJgolLuvFNnw506Ff1Lj3ZyxcyySnPZIQLSwkLQOcen7DhLdYheOKbNhb0hxXWWm0l8Wd_yU4pzweokSMn273Uc-wtezGR4cGt8WWnhfI8LoHaMIGOuad6ibYshodeYH8emuSxaLeMZJjfqoHgjeR9CjqL4pUOqGxXZPUWhcaL7a1AwR8rMIGwepBgb0r-_0QBa21crHRe_H_a-hPzDbeD0P4mD86XR64j3LJfJIOVas-MNGF_2IacG6Eq-kWex1JJMsTVXU55GPLioWsJf2N80yycePIPChJJusuITb1xZ6rLxtGWiN7P1PwWAc8QJVyvy6e0CmL7DXRx8jPx-rEz