<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="513px" preserveAspectRatio="none" style="width:567px;height:513px;background:#FFFFFF;" version="1.1" viewBox="0 0 567 513" width="567px" zoomAndPan="magnify"><title>Safe Watch Insight</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="188.0198" x="185.7826" y="31.38">Safe Watch Insight</text><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="280.1597" x="139.7126" y="58.62">Tempos de execu&#231;&#227;o mobile</text></g><g class="legend" data-source-line="19"><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="67.6641" x="21.16" y="121.584">&#160;Medida&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="177.7443" x="247.0645" y="121.584">&#160;Ap&#243;s 6 min de espera&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="80.4961" x="242.9044" y="143.376">&#160;M&#233;dia (s)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="113.6162" x="428.9688" y="121.584">&#160;Consecutivas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="80.4961" x="424.8088" y="143.376">&#160;M&#233;dia (s)&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="144.4323" x="21.16" y="165.1681">&#160;Acesso &#224; inspe&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.2161" x="247.0645" y="165.1681">&#160;3,688&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.2161" x="428.9688" y="165.1681">&#160;1,675&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="217.5844" x="21.16" y="186.9601">&#160;Preenchimento da inspe&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="58.3681" x="247.0645" y="186.9601">&#160;29,023&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="58.3681" x="428.9688" y="186.9601">&#160;29,062&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="164.6403" x="21.16" y="208.7522">&#160;Preenchimento at&#233; a&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="140.8323" x="17" y="230.5442">&#160;confirma&#231;&#227;o local&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="58.3681" x="247.0645" y="208.7522">&#160;29,218&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="58.3681" x="428.9688" y="208.7522">&#160;29,261&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="186.9924" x="21.16" y="252.3362">&#160;Relat&#243;rio pronto na tela&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.2161" x="247.0645" y="252.3362">&#160;3,700&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="49.2161" x="428.9688" y="252.3362">&#160;1,682&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="104.4799" y2="104.4799"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="148.064" y2="148.064"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="169.8561" y2="169.8561"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="191.6481" y2="191.6481"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="235.2322" y2="235.2322"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="542.585" y1="257.0243" y2="257.0243"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="17" y1="104.4799" y2="257.0243"/><line style="stroke:#000000;stroke-width:1;" x1="242.9044" x2="242.9044" y1="104.4799" y2="257.0243"/><line style="stroke:#000000;stroke-width:1;" x1="424.8088" x2="424.8088" y1="104.4799" y2="257.0243"/><line style="stroke:#000000;stroke-width:1;" x1="542.585" x2="542.585" y1="104.4799" y2="257.0243"/></g><g class="footer" data-source-line="27"><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="349.7187" x="104.9332" y="291.9902">O ensaio usou o Chromium com emula&#231;&#227;o de Pixel 7.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="412.7885" x="73.3982" y="311.0581">Por fluxo (inspe&#231;&#227;o e relat&#243;rio), foram 3 tentativas ap&#243;s espera</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="457.2803" x="51.1523" y="330.126">e 15 consecutivas. Ao todo, 36 foram aprovadas, com o piloto &#224; parte.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="456.0063" x="51.7894" y="349.1939">A digita&#231;&#227;o usou 331 ms entre caracteres. O protocolo previa 332 ms.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="453.9063" x="52.8393" y="368.2619">No Neon, registrou-se reativa&#231;&#227;o perto da primeira abertura nos seis</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="462.2503" x="48.6674" y="387.3298">blocos. No segundo bloco de relat&#243;rio, a marca registrada veio 1,592 s</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="453.3463" x="53.1193" y="406.3977">ap&#243;s a abertura. O log tem resolu&#231;&#227;o de um segundo. A contribui&#231;&#227;o</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="436.7844" x="61.4003" y="425.4656">do Neon para a diferen&#231;a e a ocorr&#234;ncia de partida a frio na Vercel</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.9994" x="199.2928" y="444.5335">ficaram indeterminadas.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.64" x="277.9725" y="463.6014">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="409.7645" x="74.9102" y="482.6694">Fonte dos dados &#8212; JSON, relat&#243;rio e confer&#234;ncia da rodada 01</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="368.1705" x="95.7072" y="501.7373">do Ensaio de Tempos Mobile (21 de novembro de 2026).</text></g><!--SRC=[XLHBRjj03DtFARXC0DMmfSPn5bsuGGkqG3veYdQJ3IrHyY2ZeJ4pSeAYYnwY1mZGHP1kSuFe9Zr9EP9Y6qYARWHfI3w-zyYHlz9sXGvhM61-LJbkR77CXXrSBtKWvJVnWafiJ7ZFDfnYJJ1t6irEt515jeZX2_sDO3BTYGKT36r2wNWdL387Sjkoro_6UaeB8nntudw91LzhMq69njCpCc__8sd8ObUGwpE2G-ibI3OerR662om9lcB8b_31UbqjmwNzJFMAlLW2T4DvqzwrlnXgNcX3IlMewliRUBmzeK8N-7WBtTTyrJvuc4AjRLVhL-GaU6abiRqlDCAUttzAFcRh1JleDVgNSjJtY9YJzmpjBMZXJHsH69HGbandi-5zaamF3pP5vux8vajTYqg60f_NfaV9ECrsFgRfFwenjFSmQCZPbjhLsDjXE4UpXKWdivsFwMI3zucCW3mupR1o734jGf33ZOx3yNYhOzOp4OS7drKkHCWDowBEWAn70MiyDy1ml7HSwwQ6d6kWkZ43FV7_ND-GWSEHEfV9bwQvOTZRMW44RaDjFn7yk3APKBC1kwa0TlFinwXaTm-aoNPe8vWp12uuWMmwbAD8N6E1FkduY6HjE7G3bAqBD59pA7Ibmy2o4v5b4wYbZmsE89VDpKKe2VvPT2nmBgihRxIMvSYoL797wfJXbDWceg7IFiWbUEMZe8vvZosi-_6ld0nJEmHSo54ZBrQMsvFsQY5JPEaaS9ugkKWCtL6qR-jE0WWrkXoVkeb2M9CCOP8S7ANWLU_KjaFaRhWICskfyMoQpLHaL4ChCJ0Q6fnUDBgBgwAN5SqICB6g52TiUuSoBGGXvbpxs-PYX215H-NsIQ2CsoLhzOLSJaQL