<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="663px" preserveAspectRatio="none" style="width:699px;height:663px;background:#FFFFFF;" version="1.1" viewBox="0 0 699 663" width="699px" zoomAndPan="magnify"><title>Safe Watch Insight</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="188.0198" x="251.5908" y="31.38">Safe Watch Insight</text><text fill="#000000" font-family="Arial" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="491.1395" x="100.031" y="58.62">Opera&#231;&#227;o offline e concorr&#234;ncia na sincroniza&#231;&#227;o</text></g><g class="legend" data-source-line="19"><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="82.5122" x="21.16" y="121.584">&#160;Execu&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="86.4482" x="188.7923" y="121.584">&#160;Ambiente&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="172.1763" x="357.4327" y="121.584">&#160;Resultado verificado&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="163.4723" x="21.16" y="143.376">&#160;Offline &#8212; instala&#231;&#227;o,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="163.4723" x="17" y="165.1681">&#160;reabertura e reenvio&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="158.6723" x="188.7923" y="143.376">&#160;Chromium, servidor&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="101.0082" x="184.6323" y="165.1681">&#160;local e Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="271.5526" x="357.4327" y="143.376">&#160;Cen&#225;rio aprovado. Reabertura sem&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="268.9445" x="353.2727" y="165.1681">&#160;rede, recupera&#231;&#227;o da fila e reenvio&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="258.0165" x="353.2727" y="186.9601">&#160;do mesmo UUID sem duplica&#231;&#227;o.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="132.6403" x="21.16" y="208.7522">&#160;Offline &#8212; edi&#231;&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="96.7682" x="17" y="230.5442">&#160;e conclus&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="158.6723" x="188.7923" y="208.7522">&#160;Chromium, servidor&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="101.0082" x="184.6323" y="230.5442">&#160;local e Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="275.3765" x="357.4327" y="208.7522">&#160;Cen&#225;rio aprovado. Seis itens e nove&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="304.3847" x="353.2727" y="230.5442">&#160;opera&#231;&#245;es em ordem, com observa&#231;&#227;o,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="282.4485" x="353.2727" y="252.3362">&#160;reabertura offline e sincroniza&#231;&#227;o. O&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="296.0806" x="353.2727" y="274.1283">&#160;reenvio da conclus&#227;o foi idempotente.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="139.7763" x="21.16" y="295.9203">&#160;Offline &#8212; conflito&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="85.5522" x="17" y="317.7124">&#160;de revis&#227;o&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="158.6723" x="188.7923" y="295.9203">&#160;Chromium, servidor&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="101.0082" x="184.6323" y="317.7124">&#160;local e Neon&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="300.3206" x="357.4327" y="295.9203">&#160;Cen&#225;rio aprovado. O conflito bloqueou&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="313.4726" x="353.2727" y="317.7124">&#160;a opera&#231;&#227;o local mesmo ap&#243;s mudan&#231;as&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="309.8407" x="353.2727" y="339.5044">&#160;de rede e preservou o dado no servidor.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="108.2722" x="21.16" y="361.2965">&#160;Concorr&#234;ncia&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="78.1122" x="17" y="383.0885">&#160;no banco&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="132.1603" x="188.7923" y="361.2965">&#160;PostgreSQL 18.4&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="132.8963" x="184.6323" y="383.0885">&#160;local descart&#225;vel&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="357.4327" y="361.2965">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="135.6483" x="361.5927" y="361.2965">18/18 aprovados.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="143.6163" x="501.401" y="361.2965">Reenvios id&#234;nticos&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="290.1445" x="353.2727" y="383.0885">&#160;gravaram uma &#250;nica vez. Em conflito,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="243.9205" x="353.2727" y="404.8806">&#160;foram preservados os registros&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="107.2162" x="353.2727" y="426.6726">&#160;confirmados.&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="108.2722" x="21.16" y="448.4646">&#160;Concorr&#234;ncia&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="113.0082" x="17" y="470.2567">&#160;no navegador&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="136.3203" x="188.7923" y="448.4646">&#160;Chromium, HTTP&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="148.1283" x="184.6323" y="470.2567">&#160;local e IndexedDB,&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="168.6404" x="184.6323" y="492.0487">&#160;com PostgreSQL 18.4&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="132.8963" x="184.6323" y="513.8408">&#160;local descart&#225;vel&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="4.16" x="357.4327" y="448.4646">&#160;</text><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="135.6483" x="361.5927" y="448.4646">10/10 aprovados.</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="155.7443" x="501.401" y="448.4646">Reenvios entre abas&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="320.9287" x="353.2727" y="470.2567">&#160;foram deduplicados. O conflito preservou&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="319.0567" x="353.2727" y="492.0487">&#160;a altera&#231;&#227;o da fila perdedora. Ap&#243;s perda&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="297.1366" x="353.2727" y="513.8408">&#160;da confirma&#231;&#227;o HTTP, n&#227;o houve nova&#160;</text><text fill="#000000" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="165.8403" x="353.2727" y="535.6328">&#160;grava&#231;&#227;o no reenvio.&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="104.4799" y2="104.4799"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="126.272" y2="126.272"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="191.6481" y2="191.6481"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="278.8163" y2="278.8163"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="344.1924" y2="344.1924"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="431.3606" y2="431.3606"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="674.2014" y1="540.3208" y2="540.3208"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="17" y1="104.4799" y2="540.3208"/><line style="stroke:#000000;stroke-width:1;" x1="184.6323" x2="184.6323" y1="104.4799" y2="540.3208"/><line style="stroke:#000000;stroke-width:1;" x1="353.2727" x2="353.2727" y1="104.4799" y2="540.3208"/><line style="stroke:#000000;stroke-width:1;" x1="674.2014" x2="674.2014" y1="104.4799" y2="540.3208"/></g><g class="footer" data-source-line="28"><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="473.0022" x="109.0996" y="575.2868">Os tr&#234;s cen&#225;rios offline foram homologados em 5 de setembro de 2026.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="442.1463" x="124.5276" y="594.3547">Os resultados finais de concorr&#234;ncia s&#227;o de 12 de outubro de 2026.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.64" x="343.7807" y="613.4226">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="477.1882" x="107.0066" y="632.4905">Fonte dos dados &#8212; AI/Offline.md, relat&#243;rio de homologa&#231;&#227;o PostgreSQL</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="464.1682" x="113.5166" y="651.5584">IC-P6-03 e atualiza&#231;&#227;o correspondente na auditoria pr&#233;-escrita do TCC.</text></g><!--SRC=[hLNDRjH84BxxAUeSJPoPB4Ivx24Ch7Oan0GIj1SkDUwofqMxU-WVWo8EF0GFa8W3WYlYmZ5-atsIhNRRCqu8GYkGHYExw_VxwgksUodr1YtMiCBYPMLDq69kbB7mUYqzPMvh5rHYKFule_qJh0bEh4GriYkgI8jeFfCN1BEZaSrBhsXhEfoEJAKndkmkxDwTjjJIId6F8xjRep2lfQwWHENeksOU_0HIxsMi89iyl4Njs4ZQPrdNDPnXIV0F-c8D2-rajVOlz7935jkFxGS3fYoLr0G4XT65iRRzh0k9e16Sr8KrMbuaronBzRAtVyBrvQCtL8Jk_FeIkfEJUYMvBWtlpyWntumG6hAob0K_HblsbetBlko_xzw3rCwZIaKcrvSlzFMb9LoHzS4YDsQ9T2ExM8wShwsfPQWduCWsKXYRGfGfKB7t4p9wS2NTNbbf03VMD5m-XsUxn8xgePYW2LSfmeuMWL1ATQDwT6KmDRdQmFFdYuSn0uYmKGojYyhlX4T2zZp538bd5LpFt2yZEYFfW7MX7Rjgqr0ADZsMhyJdDKIDS872yECgblaHtJizt1f_3il1kICaKhI3mbgN8Bd6XYNF8hYR2lRd5p-G6Sbjv6zZOhdDpvjcNWKo8OKpgjraKwuqHToqNnpKGQ1kFw8RjIKY0njBiGyJ8ABbsMkpRMm7S3xUcvI2_LR8ftslfyRvojBPqySmEyxlZJ49SWLQtrurf7hllRtPyS7iU0lCvNjxhDkET9wqu49U5gRljhBOT9T1g17QRvgroFjsaSEZUaj7F-NIHByUL4mC_BDKIUVja2w6I5jtPN-2K6D35NOpkZMyly_FJsyERg45l